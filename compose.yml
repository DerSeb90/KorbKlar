# KorbKlar on its own. Nothing here reaches outside the host.
#
#   docker compose up -d
#
# Two optional pieces live in their own files, because neither is needed to
# run the comparison and both pull in containers and settings that would
# otherwise have to be read and ignored:
#
#   docker compose -f compose.yml -f compose.kitchenowl.yml up -d
#   docker compose -f compose.yml -f compose.proxy.yml up -d
#
# They combine; see docs/deployment.md.

name: korbklar

services:
  korbklar:
    # A fork deploying its own build sets KORBKLAR_IMAGE to its namespace.
    image: ${KORBKLAR_IMAGE:-ghcr.io/lesecuritae/korbklar:latest}
    build: .
    container_name: korbklar
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    environment:
      SUPERMARKT_DATA_DIR: ${SUPERMARKT_DATA_DIR:-/data}
      SUPERMARKT_CACHE_DB: ${SUPERMARKT_CACHE_DB:-/data/supermarkt-cache.sqlite3}
      SUPERMARKT_SIGNING_SECRET_FILE: ${SUPERMARKT_SIGNING_SECRET_FILE:-/data/.signing-secret}
      SUPERMARKT_SIGNING_SECRET: ${SUPERMARKT_SIGNING_SECRET:-}
      SUPERMARKT_IMAGE_CACHE_DIR: ${SUPERMARKT_IMAGE_CACHE_DIR:-/data/supermarkt-images}
      SUPERMARKT_KAUFLAND_CACHE_DIR: ${SUPERMARKT_KAUFLAND_CACHE_DIR:-/data/kaufland}
      SUPERMARKT_REWE_CACHE_DIR: ${SUPERMARKT_REWE_CACHE_DIR:-/data/rewe}
      SUPERMARKT_USER_AGENT: ${SUPERMARKT_USER_AGENT:-}
      SUPERMARKT_CACHE_TTL_MINUTES: ${SUPERMARKT_CACHE_TTL_MINUTES:-30}
      SUPERMARKT_CACHE_MAX_SNAPSHOTS: ${SUPERMARKT_CACHE_MAX_SNAPSHOTS:-100}
      SUPERMARKT_RESULT_RETENTION_HOURS: ${SUPERMARKT_RESULT_RETENTION_HOURS:-168}
      SUPERMARKT_TIMEOUT_SECONDS: ${SUPERMARKT_TIMEOUT_SECONDS:-25}
      SUPERMARKT_MARKTGURU_PAGE_SIZE: ${SUPERMARKT_MARKTGURU_PAGE_SIZE:-500}
      SUPERMARKT_MAX_WORKERS: ${SUPERMARKT_MAX_WORKERS:-8}
      SUPERMARKT_KAUFLAND_STORE_CACHE_TTL_SECONDS: ${SUPERMARKT_KAUFLAND_STORE_CACHE_TTL_SECONDS:-86400}
      SUPERMARKT_REWE_STORE_CACHE_TTL_SECONDS: ${SUPERMARKT_REWE_STORE_CACHE_TTL_SECONDS:-86400}
      SUPERMARKT_IMAGE_CACHE_TTL_SECONDS: ${SUPERMARKT_IMAGE_CACHE_TTL_SECONDS:-604800}
      SUPERMARKT_IMAGE_CACHE_MAX_BYTES: ${SUPERMARKT_IMAGE_CACHE_MAX_BYTES:-536870912}
      SUPERMARKT_IMAGE_MAX_FILE_BYTES: ${SUPERMARKT_IMAGE_MAX_FILE_BYTES:-4194304}
      SUPERMARKT_CHROMIUM: ${SUPERMARKT_CHROMIUM:-}
      # Older spelling, still honoured so a deployed .env keeps working.
      SUPERMARKT_CHROMIUM_BINARY: ${SUPERMARKT_CHROMIUM_BINARY:-}
      # Access control. Empty means the instance is open, which is only safe
      # on a private network. See docs/access-control.md.
      SUPERMARKT_API_KEY: ${SUPERMARKT_API_KEY:-}
      SUPERMARKT_TRUSTED_NETWORKS: ${SUPERMARKT_TRUSTED_NETWORKS:-}
      SUPERMARKT_TRUSTED_PROXIES: ${SUPERMARKT_TRUSTED_PROXIES:-}
    volumes:
      - korbklar-data:/data
    networks:
      - korbklar-net
    ports:
      # KORBKLAR_BIND_ADDRESS pins the published port to a single interface.
      # Behind the reverse proxy set it to 127.0.0.1 or the VPN address; the
      # container port stays 8000 either way.
      - "${KORBKLAR_BIND_ADDRESS:-0.0.0.0}:${SUPERMARKT_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

networks:
  korbklar-net:
    # A fixed subnet so SUPERMARKT_TRUSTED_PROXIES can name the proxy without
    # depending on whatever Docker would otherwise allocate.
    ipam:
      config:
        - subnet: ${KORBKLAR_SUBNET:-172.28.0.0/24}

volumes:
  korbklar-data:
